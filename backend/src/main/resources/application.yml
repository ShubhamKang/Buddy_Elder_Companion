spring:
  application:
    name: elder-companion
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eldercompanion}
    username: ${DB_USERNAME:buddy}
    password: ${DB_PASSWORD:buddy}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Application-specific security properties (JWT) — used from Phase 1 onward.
app:
  cors:
    # Comma-separated origin patterns allowed to call the API from a browser.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  security:
    jwt:
      # 256-bit secret. Override in real environments via APP_SECURITY_JWT_SECRET.
      secret: ${APP_SECURITY_JWT_SECRET:ZmFrZS1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0}
      access-token-ttl-minutes: ${APP_JWT_ACCESS_TTL:60}
      refresh-token-ttl-days: ${APP_JWT_REFRESH_TTL:7}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

info:
  app:
    name: Buddy Elder Companion
    description: Connects elders with buddy companions for assistance
    version: 0.0.1-SNAPSHOT
